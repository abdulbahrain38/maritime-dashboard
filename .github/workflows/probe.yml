name: probe
on:
  push:
    branches: [probe-jmic]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          cat > s.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          U="https://abdulbahrain38.github.io/maritime-dashboard/?v=2"
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(args=["--use-gl=angle","--use-angle=swiftshader","--ignore-gpu-blocklist"])
              out=open("probe_out.txt","w")
              for theme in ("light","dark"):
                c=await b.new_context(viewport={"width":1280,"height":900},color_scheme=theme)
                pg=await c.new_page();errs=[]
                pg.on("pageerror",lambda e:errs.append(str(e)));pg.on("console",lambda m:m.type=="error" and errs.append(m.text))
                await pg.goto(U,wait_until="networkidle");await pg.wait_for_timeout(6000)
                await pg.screenshot(path=f"shot_{theme}.png",full_page=True)
                el=await pg.query_selector(".theatre");await el.screenshot(path=f"theatre_{theme}.png")
                el=await pg.query_selector(".mapbox");await el.screenshot(path=f"leaf_{theme}.png")
                await pg.evaluate("tmap.flyTo({center:[50.6,26.2],zoom:8,duration:0})");await pg.wait_for_timeout(5000)
                el=await pg.query_selector(".theatre");await el.screenshot(path=f"theatre_zoom_{theme}.png")
                out.write(f"{theme}: errors={errs}\n")
              await b.close()
          asyncio.run(main())
          PY
          python s.py || true
          git config user.name probe; git config user.email probe@x
          git add -f *.png probe_out.txt; git commit -qm "screens"; git push -q
