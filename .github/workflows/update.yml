name: تحديث بيانات UKMTO وWindward وCMF ونشر الصفحة

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تنزيل النسخة المنشورة حاليًا (للأرشيف والاحتياط)
        run: |
          mkdir -p prev
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}"
          curl -fsSL "$PAGES_URL/data.json" -o prev/data.json || echo "لا توجد نسخة سابقة من data.json"
          curl -fsSL "$PAGES_URL/windward.json" -o prev/windward.json || echo "لا توجد نسخة سابقة من windward.json"
          curl -fsSL "$PAGES_URL/cmf.json" -o prev/cmf.json || echo "لا توجد نسخة سابقة من cmf.json"

      - name: جلب بلاغات UKMTO مع الإبقاء على الأرشيف
        run: |
          mkdir -p site
          python fetch_ukmto.py --merge prev/data.json --out site/data.json

      - name: جلب الوضع اليومي من Windward (لا يوقف النشر إذا فشل)
        run: |
          if ! python fetch_windward.py --out site/windward.json; then
            echo "::warning::فشل جلب Windward، أُبقي على آخر نسخة منشورة"
            if [ -s prev/windward.json ]; then cp prev/windward.json site/windward.json; fi
          fi

      - name: جلب أخبار القوات البحرية المشتركة CMF (لا يوقف النشر إذا فشل)
        run: |
          if ! python fetch_cmf.py --out site/cmf.json; then
            echo "::warning::فشل جلب أخبار CMF، أُبقي على آخر نسخة منشورة"
            if [ -s prev/cmf.json ]; then cp prev/cmf.json site/cmf.json; fi
          fi

      - name: بناء الموقع
        run: cp index.html site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
